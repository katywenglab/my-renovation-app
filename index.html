<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinga 雙人共享裝潢與記帳小管家</title>
    
    <!-- iOS PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pinga記帳">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pingaBlack: '#23272a',
              pingaOrange: '#ff9f43',
              pingaRed: '#ee5253',
              pingaYellow: '#feca57',
              pingaPastelBlue: '#e0f2fe',
              pingaBg: '#f8fafc',
            },
            borderRadius: {
              'cute': '24px'
            }
          }
        }
      }
    </script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang TC", sans-serif;
            background-color: #f8fafc;
            color: #2d3436;
            -webkit-user-select: auto;
            user-select: auto;
        }

        @keyframes pingaBob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }

        .pinga-avatar {
            animation: pingaBob 3.5s infinite ease-in-out;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12));
        }

        .card-shadow {
            box-shadow: 0 10px 25px rgba(30, 39, 46, 0.06);
        }
    </style>
</head>
<body class="pb-24 pt-4 px-4 max-w-md mx-auto min-h-screen">

    <!-- Top Pinga Header -->
    <div class="bg-gradient-to-r from-white via-amber-50 to-orange-50 rounded-cute p-3.5 mb-4 flex items-center gap-3 border-3 border-pingaYellow card-shadow relative">
        <!-- Cute vector illustration of Pinga holding a purple flower -->
        <svg class="h-24 w-20 flex-shrink-0 pinga-avatar" viewBox="0 0 140 180" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Feet -->
            <ellipse cx="48" cy="162" rx="22" ry="10" fill="#FF9F43"/>
            <ellipse cx="92" cy="162" rx="22" ry="10" fill="#FF9F43"/>
            <!-- Outer Black Body -->
            <path d="M70 20 C 35 20 20 50 20 95 C 20 145 35 165 70 165 C 105 165 120 145 120 95 C 120 50 105 20 70 20 Z" fill="#23272A"/>
            <!-- White Belly/Face Patch -->
            <path d="M70 32 C 48 32 36 55 36 95 C 36 138 48 155 70 155 C 92 155 104 138 104 95 C 104 55 92 32 70 32 Z" fill="#FFFFFF"/>
            <!-- Left Arm -->
            <path d="M 22 90 C 12 105 10 120 26 128 C 36 120 38 102 34 88 Z" fill="#23272A"/>
            <!-- Eyes -->
            <circle cx="56" cy="58" r="6.5" fill="#23272A"/>
            <circle cx="54" cy="56" r="2.5" fill="#FFFFFF"/>
            <circle cx="84" cy="58" r="6.5" fill="#23272A"/>
            <circle cx="82" cy="56" r="2.5" fill="#FFFFFF"/>
            <!-- Beak -->
            <path d="M62 66 Q70 78 78 66 Q70 71 62 66 Z" fill="#EE5253"/>
            <!-- Flower Stem in Arm -->
            <path d="M 85 110 Q 100 85 108 55" stroke="#78E08F" stroke-width="4.5" stroke-linecap="round"/>
            <!-- Right Arm Holding Flower Stem -->
            <path d="M 118 90 C 128 105 115 125 96 122 C 92 110 104 98 108 88 Z" fill="#23272A"/>
            <!-- Purple Flower Petals & Center -->
            <g transform="translate(108, 52)">
                <circle cx="0" cy="-12" r="8" fill="#9B59B6"/>
                <circle cx="11" cy="-4" r="8" fill="#8E44AD"/>
                <circle cx="7" cy="10" r="8" fill="#9B59B6"/>
                <circle cx="-7" cy="10" r="8" fill="#8E44AD"/>
                <circle cx="-11" cy="-4" r="8" fill="#9B59B6"/>
                <circle cx="0" cy="0" r="6.5" fill="#F1C40F"/>
            </g>
        </svg>

        <div class="flex-1 bg-white p-3 rounded-2xl border-2 border-amber-200 shadow-sm">
            <div id="pinga-say" class="text-xs font-black text-slate-800 leading-snug">
                Noot Noot! 今天也要跟 Pinga 一起省錢與記帳喔！🌸
            </div>
            <!-- Sync Indicator -->
            <div class="mt-2 pt-1.5 border-t border-dashed border-slate-100 flex items-center justify-between text-[11px]">
                <span class="text-slate-400 font-bold">雲端同步狀態:</span>
                <span id="sync-status-badge" class="text-emerald-600 font-extrabold bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200">
                    已即時同步 ✅
                </span>
            </div>
        </div>
    </div>

    <!-- Room ID Switcher Bar -->
    <div class="bg-white rounded-2xl p-3 mb-4 card-shadow border border-slate-100 flex items-center justify-between text-xs font-bold">
        <span class="text-slate-600 flex items-center gap-1">
            🔑 共同帳簿代碼：
        </span>
        <input type="text" id="room-id-input" value="katy2026" onchange="changeRoom()" 
               class="bg-amber-50 border-2 border-amber-200 rounded-xl px-3 py-1.5 text-xs font-extrabold text-slate-800 focus:outline-none focus:border-pingaOrange text-center w-36">
    </div>

    <!-- Navigation Tabs -->
    <div class="flex bg-slate-200 p-1.5 rounded-2xl mb-4 gap-1">
        <button id="tab-renovation-btn" onclick="switchTab('renovation')" class="flex-1 py-2.5 px-1 text-xs font-black rounded-xl transition-all duration-200 bg-pingaBlack text-white shadow-md">
            🛠️ 裝潢工程款
        </button>
        <button id="tab-appliance-btn" onclick="switchTab('appliance')" class="flex-1 py-2.5 px-1 text-xs font-black text-slate-500 rounded-xl transition-all duration-200">
            📺 傢俱與家電
        </button>
        <button id="tab-daily-btn" onclick="switchTab('daily')" class="flex-1 py-2.5 px-1 text-xs font-black text-slate-500 rounded-xl transition-all duration-200">
            💸 日常小記帳
        </button>
    </div>

    <!-- ================= 1. 裝潢工程款頁面 ================= -->
    <div id="renovation-page" class="space-y-4">
        <!-- Overview Card -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 rounded-3xl p-5 text-white card-shadow relative border-2 border-pingaOrange">
            <div class="text-[11px] font-bold text-pingaOrange tracking-wider uppercase">RENOVATION CASH LEVEL</div>
            <div id="renov-water-level" class="text-3xl font-black my-1 text-white">$0</div>
            
            <div class="grid grid-cols-2 gap-2 bg-white/10 p-3 rounded-2xl mt-3 text-xs">
                <div>
                    <span class="text-slate-300 block text-[10px]">總裝潢預算</span>
                    <strong id="renov-total-budget" class="text-sm">$0</strong>
                </div>
                <div>
                    <span class="text-slate-300 block text-[10px]">已支付工程款</span>
                    <strong id="renov-paid-total" class="text-sm text-emerald-400">$0</strong>
                </div>
            </div>
            <div class="mt-2.5 text-xs text-rose-300 font-bold flex justify-between">
                <span>⏳ 尚未支付尾款：</span>
                <span id="renov-unpaid-total" class="font-extrabold">$0</span>
            </div>
        </div>

        <!-- Budget Setting Form -->
        <div class="bg-white rounded-cute p-4 card-shadow border border-slate-100">
            <h3 class="text-sm font-extrabold mb-3 text-slate-800">⚙️ 設定裝潢總預算</h3>
            <div class="flex gap-2">
                <input type="number" id="budget-input" placeholder="請輸入總預算 (例: 1500000)" class="flex-1 bg-slate-50 border-2 border-slate-100 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pingaOrange">
                <button onclick="setTotalBudget()" class="bg-pingaBlack text-white font-extrabold px-4 py-2 rounded-xl text-xs hover:bg-black transition shadow">更新</button>
            </div>
        </div>

        <!-- Add Item Form -->
        <div class="bg-white rounded-cute p-4 card-shadow border border-slate-100 space-y-3">
            <h3 class="text-sm font-extrabold text-slate-800">🔨 新增裝潢工程項目</h3>
            <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1">項目名稱</label>
                <input type="text" id="renov-item-name" placeholder="例：第一期泥作拆除、系統櫃款項" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-pingaOrange">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">金額 (NTD)</label>
                    <input type="number" id="renov-item-amount" placeholder="0" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-pingaOrange">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">付款狀態</label>
                    <select id="renov-item-status" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-pingaOrange">
                        <option value="unpaid">尚未支付 ⏳</option>
                        <option value="paid">已支付 ✅</option>
                    </select>
                </div>
            </div>
            <button onclick="addRenovationItem()" class="w-full bg-pingaOrange text-white font-extrabold py-3 rounded-xl text-xs shadow-lg shadow-amber-200 hover:bg-amber-500 transition">
                新增工程項目 🌸
            </button>
        </div>

        <!-- List -->
        <div class="bg-white rounded-cute p-4 card-shadow border border-slate-100">
            <h3 class="text-sm font-extrabold mb-3 text-slate-800">📝 裝潢明細與合約/收據夾檔</h3>
            <div id="renovation-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- ================= 2. 傢俱與家電頁面 ================= -->
    <div id="appliance-page" class="space-y-4 hidden">
        <div class="bg-gradient-to-br from-sky-600 to-sky-500 rounded-3xl p-5 text-white card-shadow relative border-2 border-sky-300">
            <div class="text-[11px] font-bold text-sky-100 tracking-wider uppercase">FURNITURE & APPLIANCES</div>
            <div id="appliance-paid-total" class="text-3xl font-black my-1 text-white">$0</div>
            <div class="text-xs text-sky-100 font-bold mt-2">
                🛒 預計選購總額：<span id="appliance-planned-total" class="text-white font-extrabold">$0</span>
            </div>
        </div>

        <!-- Add Appliance Form -->
        <div class="bg-white rounded-cute p-4 card-shadow border border-slate-100 space-y-3">
            <h3 class="text-sm font-extrabold text-slate-800">🌱 新增傢俱 / 家電願望筆記</h3>
            <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1">品項名稱</label>
                <input type="text" id="app-name" placeholder="例：電視、滾筒洗衣機、沙發" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-sky-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">預估/實際價格 (NTD)</label>
                    <input type="number" id="app-price" placeholder="0" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">購買狀態</label>
                    <select id="app-status" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-sky-500">
                        <option value="unpaid">預計採購/清單中 🛒</option>
                        <option value="paid">已購買已付款 ✅</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1">型號與採購筆記 (品牌、尺寸、購買通路)</label>
                <textarea id="app-note" rows="2" placeholder="例：Panasonic NA-V120，MOMO 折扣價 $28,900" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-sky-500"></textarea>
            </div>
            <button onclick="addApplianceItem()" class="w-full bg-sky-500 text-white font-extrabold py-3 rounded-xl text-xs shadow-lg shadow-sky-200 hover:bg-sky-600 transition">
                加入家電願望筆記 📺
            </button>
        </div>

        <!-- Appliance List -->
        <div class="bg-white rounded-cute p-4 card-shadow border border-slate-100">
            <h3 class="text-sm font-extrabold mb-3 text-slate-800">📺 傢俱家電選購與採購筆記</h3>
            <div id="appliance-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- ================= 3. 日常小記帳頁面 ================= -->
    <div id="daily-page" class="space-y-4 hidden">
        <div class="bg-white rounded-cute p-4 card-shadow border border-slate-100 space-y-3">
            <h3 class="text-sm font-extrabold text-slate-800">➕ 日常小記帳</h3>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">類型</label>
                    <select id="daily-type" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-pingaOrange">
                        <option value="expense">支出 💸</option>
                        <option value="income">收入 💰</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">金額 (NTD)</label>
                    <input type="number" id="daily-amount" placeholder="0" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-pingaOrange">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1">項目名稱</label>
                <input type="text" id="daily-name" placeholder="例：晚餐、特力屋零件、五金" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-pingaOrange">
            </div>
            <button onclick="addDailyRecord()" class="w-full bg-pingaOrange text-white font-extrabold py-3 rounded-xl text-xs shadow-lg shadow-amber-200 hover:bg-amber-500 transition">
                記錄下來 🌸
            </button>
        </div>

        <div class="bg-white rounded-cute p-4 card-shadow border border-slate-100">
            <h3 class="text-sm font-extrabold mb-3 text-slate-800">📋 日常收支紀錄</h3>
            <div id="daily-list" class="divide-y divide-slate-100"></div>
        </div>
    </div>

    <script>
        let currentRoom = localStorage.getItem('pinga_room_id') || 'katy2026';
        document.getElementById('room-id-input').value = currentRoom;

        let state = {
            daily: [],
            renovationBudget: 1500000,
            renovationItems: [],
            applianceItems: []
        };

        const pingaQuotes = {
            renovation: "Noot Noot! 今天也要跟 Pinga 一起省錢與記帳喔！🌸",
            appliance: "Pinga 最喜歡看新家家電了！有沒有想買的小花家電？📺",
            daily: "今天也有好好省錢嗎？Pinga 幫妳記下來！💸"
        };

        function loadRoomData() {
            const saved = localStorage.getItem('pinga_room_' + currentRoom);
            if (saved) {
                state = JSON.parse(saved);
            } else {
                state = {
                    daily: [],
                    renovationBudget: 1500000,
                    renovationItems: [
                        { id: 1, name: "第一期泥作工程 🧱", amount: 200000, status: "paid", attachment: null },
                        { id: 2, name: "全屋系統櫃與木工 🪵", amount: 480000, status: "unpaid", attachment: null }
                    ],
                    applianceItems: [
                        { id: 101, name: "滾筒洗衣機 🧺", price: 35000, note: "Panasonic NA-V120 (MOMO 詢價 $32,900)", status: "unpaid", attachment: null }
                    ]
                };
                saveData();
            }
            render();
        }

        function changeRoom() {
            const inputVal = document.getElementById('room-id-input').value.trim();
            if (inputVal) {
                currentRoom = inputVal;
                localStorage.setItem('pinga_room_id', currentRoom);
                loadRoomData();
            }
        }

        function saveData() {
            localStorage.setItem('pinga_room_' + currentRoom, JSON.stringify(state));
            render();
        }

        function switchTab(tab) {
            document.querySelectorAll('#renovation-page, #appliance-page, #daily-page').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('#tab-renovation-btn, #tab-appliance-btn, #tab-daily-btn').forEach(btn => {
                btn.className = "flex-1 py-2.5 px-1 text-xs font-black text-slate-500 rounded-xl transition-all duration-200";
            });

            document.getElementById('pinga-say').innerText = pingaQuotes[tab];

            if (tab === 'renovation') {
                document.getElementById('renovation-page').classList.remove('hidden');
                document.getElementById('tab-renovation-btn').className = "flex-1 py-2.5 px-1 text-xs font-black rounded-xl bg-pingaBlack text-white shadow-md";
            } else if (tab === 'appliance') {
                document.getElementById('appliance-page').classList.remove('hidden');
                document.getElementById('tab-appliance-btn').className = "flex-1 py-2.5 px-1 text-xs font-black rounded-xl bg-sky-600 text-white shadow-md";
            } else {
                document.getElementById('daily-page').classList.remove('hidden');
                document.getElementById('tab-daily-btn').className = "flex-1 py-2.5 px-1 text-xs font-black rounded-xl bg-pingaOrange text-white shadow-md";
            }
        }

        function setTotalBudget() {
            const budget = parseFloat(document.getElementById('budget-input').value);
            if (isNaN(budget) || budget <= 0) return alert('請輸入有效預算');
            state.renovationBudget = budget;
            document.getElementById('budget-input').value = '';
            saveData();
        }

        function addRenovationItem() {
            const name = document.getElementById('renov-item-name').value.trim();
            const amount = parseFloat(document.getElementById('renov-item-amount').value);
            const status = document.getElementById('renov-item-status').value;

            if (!name || isNaN(amount)) return alert('請填寫完整資訊');

            if (!state.renovationItems) state.renovationItems = [];
            state.renovationItems.unshift({ id: Date.now(), name, amount, status, attachment: null });
            document.getElementById('renov-item-name').value = '';
            document.getElementById('renov-item-amount').value = '';
            saveData();
        }

        function addApplianceItem() {
            const name = document.getElementById('app-name').value.trim();
            const price = parseFloat(document.getElementById('app-price').value);
            const note = document.getElementById('app-note').value.trim();
            const status = document.getElementById('app-status').value;

            if (!name || isNaN(price)) return alert('請填寫品項名稱與金額');

            if (!state.applianceItems) state.applianceItems = [];
            state.applianceItems.unshift({ id: Date.now(), name, price, note, status, attachment: null });
            document.getElementById('app-name').value = '';
            document.getElementById('app-price').value = '';
            document.getElementById('app-note').value = '';
            saveData();
        }

        function deleteItem(type, id) {
            if (!confirm('確定要刪除這筆項目嗎？')) return;

            if (type === 'renov') state.renovationItems = state.renovationItems.filter(i => i.id !== id);
            else if (type === 'appliance') state.applianceItems = state.applianceItems.filter(i => i.id !== id);
            else if (type === 'daily') state.daily = state.daily.filter(i => i.id !== id);
            
            saveData();
        }

        function toggleStatus(type, id) {
            const list = type === 'renov' ? state.renovationItems : state.applianceItems;
            const item = list.find(i => i.id === id);
            if (item) {
                item.status = item.status === 'paid' ? 'unpaid' : 'paid';
                saveData();
            }
        }

        function uploadFile(type, id, input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const list = type === 'renov' ? state.renovationItems : state.applianceItems;
                const item = list.find(i => i.id === id);
                if (item) {
                    item.attachment = { name: file.name, data: e.target.result, isImage: file.type.startsWith('image/') };
                    saveData();
                }
            };
            reader.readAsDataURL(file);
        }

        function addDailyRecord() {
            const name = document.getElementById('daily-name').value.trim();
            const amount = parseFloat(document.getElementById('daily-amount').value);
            const type = document.getElementById('daily-type').value;

            if (!name || isNaN(amount)) return alert('請填寫完整資訊');

            if (!state.daily) state.daily = [];
            state.daily.unshift({ id: Date.now(), name, amount, type, date: new Date().toLocaleDateString() });
            document.getElementById('daily-name').value = '';
            document.getElementById('daily-amount').value = '';
            saveData();
        }

        function render() {
            // 1. Renovation
            let paidTotal = 0, unpaidTotal = 0;
            (state.renovationItems || []).forEach(i => {
                if (i.status === 'paid') paidTotal += i.amount;
                else unpaidTotal += i.amount;
            });

            document.getElementById('renov-water-level').innerText = `$${((state.renovationBudget || 1500000) - paidTotal).toLocaleString()}`;
            document.getElementById('renov-total-budget').innerText = `$${(state.renovationBudget || 1500000).toLocaleString()}`;
            document.getElementById('renov-paid-total').innerText = `$${paidTotal.toLocaleString()}`;
            document.getElementById('renov-unpaid-total').innerText = `$${unpaidTotal.toLocaleString()}`;

            const renovContainer = document.getElementById('renovation-list');
            if (!state.renovationItems || state.renovationItems.length === 0) {
                renovContainer.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">🌸 Noot Noot! 還沒有任何工程項目喔</div>`;
            } else {
                renovContainer.innerHTML = state.renovationItems.map(item => `
                    <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-extrabold text-xs text-slate-800">${item.name}</div>
                                <div class="font-black text-sm text-blue-600 mt-0.5">$${item.amount.toLocaleString()}</div>
                            </div>
                            <span onclick="toggleStatus('renov', ${item.id})" class="text-[10px] font-extrabold px-2.5 py-1 rounded-full cursor-pointer ${item.status === 'paid' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-amber-100 text-amber-800 border border-amber-300'}">
                                ${item.status === 'paid' ? '已支付 ✅' : '未支付 ⏳'}
                            </span>
                        </div>
                        <div class="mt-2.5 pt-2 border-t border-dashed border-slate-200 flex justify-between items-center text-[11px]">
                            <div class="flex items-center gap-2">
                                <label class="bg-blue-50 text-blue-600 px-2.5 py-1 rounded-lg font-bold cursor-pointer hover:bg-blue-100">
                                    📎 ${item.attachment ? '更換收據' : '上傳收據/合約'}
                                    <input type="file" class="hidden" accept="image/*,.pdf" onchange="uploadFile('renov', ${item.id}, this)">
                                </label>
                                ${item.attachment ? `<a href="${item.attachment.data}" target="_blank" class="text-blue-600 font-extrabold underline">[檢視]</a>` : '<span class="text-slate-400">無附件</span>'}
                            </div>
                            <button onclick="deleteItem('renov', ${item.id})" class="bg-rose-100 text-rose-600 font-bold px-2 py-1 rounded-lg">🗑️ 刪除</button>
                        </div>
                    </div>
                `).join('');
            }

            // 2. Appliance
            let appPaid = 0, appPlanned = 0;
            (state.applianceItems || []).forEach(i => {
                appPlanned += i.price;
                if (i.status === 'paid') appPaid += i.price;
            });

            document.getElementById('appliance-paid-total').innerText = `$${appPaid.toLocaleString()}`;
            document.getElementById('appliance-planned-total').innerText = `$${appPlanned.toLocaleString()}`;

            const appContainer = document.getElementById('appliance-list');
            if (!state.applianceItems || state.applianceItems.length === 0) {
                appContainer.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">📺 Pinga 沒看到願望清單，快新增喜歡的家電吧！</div>`;
            } else {
                appContainer.innerHTML = state.applianceItems.map(item => `
                    <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-extrabold text-xs text-slate-800">${item.name}</div>
                                <div class="font-black text-sm text-sky-600 mt-0.5">$${item.price.toLocaleString()}</div>
                            </div>
                            <span onclick="toggleStatus('appliance', ${item.id})" class="text-[10px] font-extrabold px-2.5 py-1 rounded-full cursor-pointer ${item.status === 'paid' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-sky-100 text-sky-800 border border-sky-300'}">
                                ${item.status === 'paid' ? '已購買 ✅' : '願望中 🛒'}
                            </span>
                        </div>
                        ${item.note ? `<div class="mt-2 bg-amber-50 p-2 rounded-xl text-[11px] text-slate-600 border border-amber-200">📌 筆記/型號：${item.note}</div>` : ''}
                        <div class="mt-2.5 pt-2 border-t border-dashed border-slate-200 flex justify-between items-center text-[11px]">
                            <div class="flex items-center gap-2">
                                <label class="bg-sky-50 text-sky-600 px-2.5 py-1 rounded-lg font-bold cursor-pointer hover:bg-sky-100">
                                    📎 ${item.attachment ? '更換照片' : '上傳發票/保固卡'}
                                    <input type="file" class="hidden" accept="image/*,.pdf" onchange="uploadFile('appliance', ${item.id}, this)">
                                </label>
                                ${item.attachment ? `<a href="${item.attachment.data}" target="_blank" class="text-sky-600 font-extrabold underline">[檢視]</a>` : '<span class="text-slate-400">無照片</span>'}
                            </div>
                            <button onclick="deleteItem('appliance', ${item.id})" class="bg-rose-100 text-rose-600 font-bold px-2 py-1 rounded-lg">🗑️ 刪除</button>
                        </div>
                    </div>
                `).join('');
            }

            // 3. Daily
            const dailyContainer = document.getElementById('daily-list');
            if (!state.daily || state.daily.length === 0) {
                dailyContainer.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">💸 今天還沒有記錄任何收支喔！</div>`;
            } else {
                dailyContainer.innerHTML = state.daily.map(item => `
                    <div class="flex justify-between items-center py-2.5">
                        <div>
                            <div class="font-extrabold text-xs text-slate-800">${item.name}</div>
                            <div class="text-[10px] text-slate-400">${item.date}</div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="font-black text-sm ${item.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
                                ${item.type === 'income' ? '+' : '-'} $${item.amount.toLocaleString()}
                            </div>
                            <button onclick="deleteItem('daily', ${item.id})" class="text-slate-300 hover:text-rose-500 font-bold text-xs">✕</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        loadRoomData();
    </script>
</body>
</html>
